                          <clipPath id="clip0_3000_6288">
                            <rect fill="currentColor" height="46.1396" width="38"></rect>
                          </clipPath>
                        </defs>
                      </svg>
                    </div>
                    <div>
                      <div class="card-title">macOS · Intel</div>
                      <p class="card-meta">macOS 11 이상 · x64 · .dmg 설치 프로그램</p>
                    </div>
                  </div>
                  <div class="download-action">
                    <a href="downloads/KBPM-macOS-intel.dmg" target="downloader" class="download-button">다운로드</a>
                  </div>
                </div>
                <div class="card">
                  <div class="card-head">
                    <div class="card-icon">
                      <svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" height="50" width="50">
                        <path d="M17.5009 11.3008H9.19727V17.2941L17.5009 18.4995V11.3008Z" fill="currentColor"></path>
                        <path d="M8.66077 11.3008H2.5V16.3231L8.66077 17.2171V11.3008Z" fill="currentColor"></path>
                        <path d="M17.5009 3.5L9.19727 4.68528V10.7657H17.5009V3.5Z" fill="currentColor"></path>
                        <path d="M8.66077 4.76367L2.5 5.64426V10.7671H8.66077V4.76367Z" fill="currentColor"></path>
                      </svg>
                    </div>
                    <div>
                      <div class="card-title">Windows · x64</div>
                      <p class="card-meta">Windows 10/11 · x64 · .exe 설치 프로그램</p>
                    </div>
                  </div>
                  <div class="download-action">
                    <a href="downloads/KBPM.exe" target="downloader" class="download-button">다운로드</a>
                  </div>
                </div>
              </div>
            </main>
          </div>
          <div class="modal">
            <div class="modal-panel">
              <img src="FEEDME.jpeg" alt="지원 안내 이미지">
              <p>다운로드가 진행중입니다...</p>
              <p>다운로드가 되지 않나요? <a href="#" class="manual-link">여기를 눌러주세요</a></p>
              <button type="button" class="modal-close">닫기</button>
            </div>
          </div>
          <script type="module">
            const ua = navigator.userAgent || "";
            const platform = navigator.platform || "";

            function isMobile() {
              return /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
            }
            function isWindows() {
              return /Win/.test(platform) || /Windows/.test(ua);
            }
            function isMac() {
              return /Mac/.test(platform) || /Macintosh/.test(ua);
            }

            function detectEnvironment() {
              const mobile = isMobile();
              let os = "unknown";
              let arch = "unknown";
              let binary = null;
              let supportedDesktop = false;

              if (mobile) {
                os = "mobile";
              } else if (isWindows()) {
                os = "windows";
                arch = "x64";
                binary = "downloads/KBPM.exe";
                supportedDesktop = true;
              } else if (isMac()) {
                os = "macos";
                // 기본적으로 최신 macOS는 Apple Silicon(arm) 기반이라고 가정
                arch = "arm64";
                binary = "downloads/KBPM-macOS-arm64.dmg";
                supportedDesktop = true;
              }

              return { mobile, os, arch, binary, supportedDesktop };
            }

            const env = detectEnvironment();

            // DOM references
            const root = document.documentElement;
            const statusLine = document.getElementById("status-line");
            const donateLine = document.getElementById("donate-line");
            const iframe = document.querySelector("iframe[name=\"downloader\"]");
            const intelHint = document.getElementById("intel-hint");

            // Expose tracking parameters on DOM
            root.dataset.kbpmOs = env.os;
            root.dataset.kbpmArch = env.arch;
            if (env.binary) {
              root.dataset.kbpmBinary = env.binary;
            }

            // Update status text and possibly trigger download
            if (!statusLine) {
              // nothing to do if markup changed
            } else if (env.mobile) {
              statusLine.innerHTML = "죄송합니다. KBPM은 현재 <strong>Windows PC 또는 macOS</strong>에서만 사용 가능합니다.";
            } else if (env.supportedDesktop && env.binary && iframe) {
              statusLine.innerHTML =
                "감지된 환경: <strong>" +
                (env.os === "windows" ? "Windows · x64" : "macOS · Apple Silicon") +
                "</strong><br>다운로드가 자동으로 시작되었습니다. 잠시만 기다려 주세요.";
              donateLine && (donateLine.hidden = false);
              if (env.os === "macos" && intelHint) {
                intelHint.hidden = false;
              }
              iframe.src = env.binary;
            } else {
              statusLine.textContent =
                "자동으로 적절한 설치 파일을 선택하지 못했습니다. 아래에서 직접 설치 파일을 선택해 주세요.";
            }

            // ---- Firebase Analytics tracking (optional) ----
            // 1) Firebase 콘솔에서 프로젝트 및 Web App 생성
            // 2) 아래 firebaseConfig 값을 본인 프로젝트 설정으로 교체
            // 3) measurementId 가 있을 경우 Analytics 이벤트가 GA4로 전송됩니다.
            import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
            import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-analytics.js";

            const firebaseConfig = {
              apiKey: "AIzaSyCdYmDv2QDkhK42b8Vi9c521_OtT771bpg",
              authDomain: "kbpm-web.firebaseapp.com",
              projectId: "kbpm-web",
              storageBucket: "kbpm-web.firebasestorage.app",
              messagingSenderId: "159499222428",
              appId: "1:159499222428:web:3157717182dbaf62cadc59",
              measurementId: "G-631V6S8WLZ"
            };

            try {
              const app = initializeApp(firebaseConfig);
              const analytics = getAnalytics(app);

              logEvent(analytics, "kbpm_download_page_view", {
                os: env.os,
                arch: env.arch,
                binary: env.binary || "none",
                is_mobile: env.mobile,
                supported_desktop: env.supportedDesktop
              });

              // 다운로드 자동 시작이 된 경우 별도 이벤트도 전송
              if (env.supportedDesktop && env.binary) {
                logEvent(analytics, "kbpm_download_auto_start", {
                  os: env.os,
                  arch: env.arch,
                  binary: env.binary
                });
              }
            } catch (e) {
              // Firebase 설정이 아직 안 되어 있거나, 로드 실패 시 조용히 무시
              console.warn("Firebase initialization / analytics failed:", e);
            }
          </script>
          </body>
          </html>
          HTML
          perl -pi -e 's|\$\{SOURCE_REPO\}|'"$SOURCE_REPO"'|g' index.html
          perl -pi -e 's|\$\{LATEST_VERSION\}|'"$LATEST_TAG"'|g' index.html
          perl -pi -e 's|\$\{LATEST_DATE\}|'"$LATEST_DATE"'|g' index.html

      - name: Create manifest.json with checksums
        run: |
          set -euo pipefail
          cd "$SITE_DIR/downloads"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def sha256sum(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def human_size(num: int) -> str:
              units = ["B", "KiB", "MiB", "GiB", "TiB"]
              value = float(num)
              for unit in units:
                  if value < 1024 or unit == units[-1]:
                      if unit == "B":
                          return f"{int(value)}B"
                      return f"{value:.1f}{unit}"
                  value /= 1024
              return f"{value:.1f}TiB"

          files = [
              "KBPM-macOS-arm64.dmg",
              "KBPM-macOS-intel.dmg",
              "KBPM.exe",
          ]
          manifest = {"files": []}
          for name in files:
              path = Path(name)
              if not path.exists():
                  continue
              size_bytes = path.stat().st_size
              manifest["files"].append(
                  {
                      "name": name,
                      "path": f"downloads/{name}",
                      "sha256": sha256sum(path),
                      "size": human_size(size_bytes),
                  }
              )

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)

          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
