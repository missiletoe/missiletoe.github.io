name: Deploy KBPM Downloads to GitHub Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish_kbpm_pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # Fine-grained PAT with read access to missiletoe/kream_inventory.
  # Create this secret in KBPM > Settings > Secrets and variables > Actions.
  GH_TOKEN: ${{ secrets.KBPM_SOURCE_TOKEN }}
  SOURCE_REPO: missiletoe/kream_inventory
  SITE_DIR: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KBPM Pages repo
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          set -euo pipefail
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR/downloads"
          if [ -f "FEEDME.jpeg" ]; then
            cp "FEEDME.jpeg" "$SITE_DIR/FEEDME.jpeg"
          elif [ -f "docs/images/FEEDME.jpeg" ]; then
            cp "docs/images/FEEDME.jpeg" "$SITE_DIR/FEEDME.jpeg"
          fi
          if [ -f "icon.png" ]; then
            cp "icon.png" "$SITE_DIR/icon.png"
          elif [ -f "docs/images/icon.png" ]; then
            cp "docs/images/icon.png" "$SITE_DIR/icon.png"
          fi

      - name: Download latest release assets from kream_inventory
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_TOKEN is not configured" >&2
            exit 1
          fi
          gh release download --repo "$SOURCE_REPO" \
            --pattern 'KBPM-macOS-arm64.dmg' \
            --pattern 'KBPM-macOS-intel.dmg' \
            --pattern 'KBPM.exe' \
            --dir "$SITE_DIR/downloads" --clobber

      - name: Generate index.html
        working-directory: ${{ env.SITE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          meta=$(gh release view --repo "$SOURCE_REPO" --json tagName,publishedAt --jq '.tagName + "|" + .publishedAt')
          IFS='|' read -r LATEST_TAG LATEST_PUBLISHED <<< "$meta"
          LATEST_DATE=$(date -u -d "$LATEST_PUBLISHED" '+%Y-%m-%d' 2>/dev/null || echo "$LATEST_PUBLISHED")
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>KBPM 다운로드</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap">
          <style>
            :root{
              color-scheme:light dark;
              --page-bg:#f4f6fb;
              --surface-bg:#ffffff;
              --card-bg:#f8f9fc;
              --text-color:#101828;
              --subtle-text:rgba(16,24,40,.65);
              --border-color:rgba(16,24,40,.12);
              --accent:#0f62fe;
            }
            @media (prefers-color-scheme: dark){
              :root{
                --page-bg:#0f1117;
                --surface-bg:#161925;
                --card-bg:#1f2433;
                --text-color:#f4f4f5;
                --subtle-text:rgba(244,244,245,.75);
                --border-color:rgba(244,244,245,.18);
                --accent:#6ea8fe;
              }
            }
            *{box-sizing:border-box;}
            html,body{height:100%;}
            body{
              font-family:'Nanum Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
              background:var(--page-bg);
              color:var(--text-color);
              margin:0;
              min-height:100vh;
              display:flex;
              align-items:center;
              justify-content:center;
              overflow:hidden; /* no scrollbar */
              padding:1.5rem;
            }
            .surface{
              width:min(960px,100%);
              height:min(640px,calc(100vh - 3rem));
              background:var(--surface-bg);
              border-radius:28px;
              padding:clamp(1.25rem,3vw,2.5rem);
              display:flex;
              flex-direction:column;
              gap:1.5rem;
              box-shadow:0 25px 60px rgba(15,17,26,0.18);
            }
            header{
              display:flex;
              align-items:center;
              gap:1.25rem;
            }
            header img{
              width:80px;
              height:80px;
              border-radius:20px;
              background:var(--card-bg);
              padding:0.75rem;
              object-fit:contain;
            }
            h1{
              font-size:1.9rem;
              margin:0;
            }
            .description{
              margin:0.25rem 0 0;
              font-size:0.95rem;
              color:var(--subtle-text);
            }
            .version,
            .release-date{
              margin:0.15rem 0 0;
              font-size:0.9rem;
              color:var(--subtle-text);
            }
            .status{
              margin-top:0.5rem;
              font-size:0.95rem;
              color:var(--subtle-text);
              line-height:1.4;
            }
            .status strong{
              color:var(--text-color);
            }
            .donate{
              margin-top:0.75rem;
              display:flex;
              align-items:center;
              gap:0.75rem;
            }
            .donate img{
              width:64px;
              height:64px;
              border-radius:16px;
              object-fit:cover;
              flex-shrink:0;
            }
            .donate-text{
              display:block;
            }
            .donate a{
              color:var(--accent);
              font-weight:700;
              text-decoration:none;
              border-bottom:1px solid currentColor;
              padding-bottom:0.1rem;
            }
            main{
              flex:1;
              display:flex;
              flex-direction:column;
              gap:1.25rem;
            }
            .downloads{
              flex:1;
              display:grid;
              grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
              gap:1rem;
            }
            .card{
              background:var(--card-bg);
              border:1px solid var(--border-color);
              border-radius:22px;
              padding:1.25rem;
              display:flex;
              flex-direction:column;
              gap:0.75rem;
            }
            .card-title{
              font-size:1.1rem;
              font-weight:700;
            }
            .card-meta{
              font-size:0.9rem;
              color:var(--subtle-text);
              line-height:1.4;
            }
            .card-head{
              display:flex;
              gap:0.75rem;
              align-items:flex-start;
            }
            .card-icon{
              display:flex;
              align-items:center;
              justify-content:center;
              width:48px;
              height:48px;
              border-radius:14px;
              background:rgba(16,24,40,.05);
              color:var(--text-color);
              flex-shrink:0;
            }
            .card-icon svg{
              display:block;
              width:32px;
              height:32px;
            }
            .download-action{
              margin-top:auto;
            }
            .download-button{
              width:100%;
              display:inline-flex;
              align-items:center;
              justify-content:center;
              border:none;
              border-radius:999px;
              padding:0.75rem 1rem;
              font-size:1rem;
              font-weight:700;
              color:#fff;
              background:var(--accent);
              cursor:pointer;
              text-decoration:none;
              transition:transform .2s ease,box-shadow .2s ease;
            }
            .download-button:hover{
              transform:translateY(-1px);
              box-shadow:0 8px 18px rgba(15,98,254,.35);
            }
            .download-button:focus-visible{
              outline:3px solid rgba(15,98,254,.45);
              outline-offset:2px;
            }
            iframe[name="downloader"]{display:none;}

            /* Modal 기본 상태 */
            .modal{
              position:fixed;
              inset:0;
              display:flex;
              align-items:center;
              justify-content:center;
              background:rgba(15,17,26,.63);
              opacity:0;
              pointer-events:none;
              transition:opacity .18s ease;
              padding:1rem;
            }
            .modal-panel{
              background:var(--surface-bg);
              border-radius:24px;
              padding:2rem;
              max-width:420px;
              width:100%;
              text-align:center;
              box-shadow:0 20px 45px rgba(0,0,0,.35);
            }
            .modal-panel img{
              width:200px;
              max-width:70%;
              margin:0 auto 1.5rem;
              display:block;
              border-radius:16px;
            }
            .modal-panel p{margin:0.5rem 0;}
            .modal-close{
              margin-top:1.5rem;
              display:inline-flex;
              justify-content:center;
              align-items:center;
              padding:0.65rem 1.5rem;
              border-radius:999px;
              border:1px solid var(--border-color);
              cursor:pointer;
              font-weight:700;
              color:var(--text-color);
              background:transparent;
            }
            .manual-link{
              color:var(--accent);
              font-weight:700;
              text-decoration:none;
              border-bottom:1px solid currentColor;
              padding-bottom:0.15rem;
            }

            /* 다운로드 버튼이 포커스되면 모달을 표시 (CSS-only) */
            body:has(.download-button:focus) .modal,
            body:has(.download-button:active) .modal{
              opacity:1;
              pointer-events:auto;
            }

            @media (max-width:720px){
              body{padding:0.75rem;}
              .surface{height:calc(100vh - 1.5rem);border-radius:18px;}
              header{flex-direction:column;text-align:center;}
              .downloads{grid-template-columns:1fr;}
            }
          </style>
          </head>
          <body>
          <iframe name="downloader" title="다운로드 진행창"></iframe>
          <div class="surface">
            <header>
              <img src="icon.png" alt="KBPM 아이콘">
              <div>
                <h1>KBPM 다운로드</h1>
                <p class="version">최신 버전: <strong>${LATEST_VERSION}</strong></p>
                <p class="release-date">출시일: <time datetime="${LATEST_DATE}">${LATEST_DATE}</time></p>
                <p id="status-line" class="status">사용자 환경을 확인하고 있습니다...</p>
                <p id="donate-line" class="donate" hidden>
                  <span class="donate-text">KBPM 이 도움이 되셨다면 기부로 개발을 응원해주세요.</span>
                  <img src="FEEDME.jpeg" alt="토스 기부 링크 QR 코드">
                </p>
                <p id="intel-hint" class="status" hidden>
                  만약 앱 아이콘에 🚫 로고가 표시된다면,
                  <a href="downloads/KBPM-macOS-intel.dmg" class="manual-link">인텔용 설치 프로그램 링크</a>를 클릭해서 설치를 진행해 주세요.
                </p>
              </div>
            </header>
            <main>
              <div class="downloads">
                <div class="card">
                  <div class="card-head">
                    <div class="card-icon">
                      <svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 17" height="46.1396" width="38">
                        <g clip-path="url(#clip0_3000_6288)">
                          <path d="M13.3997 5.7953C13.3011 5.8718 11.5603 6.8527 11.5603 9.0338C11.5603 11.5566 13.7754 12.4491 13.8417 12.4712C13.8315 12.5256 13.4898 13.6935 12.6738 14.8835C11.9462 15.9307 11.1863 16.9762 10.0303 16.9762C8.87425 16.9762 8.57675 16.3047 7.24225 16.3047C5.94175 16.3047 5.47935 16.9983 4.42195 16.9983C3.36455 16.9983 2.62675 16.0293 1.77845 14.8393C0.795853 13.4419 0.00195312 11.271 0.00195312 9.2106C0.00195312 5.9058 2.15075 4.1531 4.26555 4.1531C5.38925 4.1531 6.32595 4.8909 7.03145 4.8909C7.70295 4.8909 8.75015 4.1089 10.0286 4.1089C10.5131 4.1089 12.2539 4.1531 13.3997 5.7953ZM9.42165 2.7098C9.95035 2.0825 10.3244 1.2121 10.3244 0.3417C10.3244 0.221 10.3142 0.0986 10.2921 0C9.43185 0.0323 8.40845 0.5729 7.79135 1.2886C7.30685 1.8394 6.85465 2.7098 6.85465 3.5921C6.85465 3.7247 6.87675 3.8573 6.88695 3.8998C6.94135 3.91 7.02975 3.9219 7.11815 3.9219C7.88995 3.9219 8.86065 3.4051 9.42165 2.7098Z" fill="currentColor"></path>
                        </g>
                        <defs>
                          <clipPath id="clip0_3000_6288">
                            <rect fill="currentColor" height="46.1396" width="38"></rect>
                          </clipPath>
                        </defs>
                      </svg>
                    </div>
                    <div>
                      <div class="card-title">macOS · Apple Silicon</div>
                      <p class="card-meta">macOS 12 이상 · arm64 · .dmg 설치 프로그램</p>
                    </div>
                  </div>
                  <div class="download-action">
                    <a href="downloads/KBPM-macOS-arm64.dmg" target="downloader" class="download-button">다운로드</a>
                  </div>
                </div>
                <div class="card">
                  <div class="card-head">
                    <div class="card-icon">
                      <svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 17" height="46.1396" width="38">
                        <g clip-path="url(#clip0_3000_6288)">
                          <path d="M13.3997 5.7953C13.3011 5.8718 11.5603 6.8527 11.5603 9.0338C11.5603 11.5566 13.7754 12.4491 13.8417 12.4712C13.8315 12.5256 13.4898 13.6935 12.6738 14.8835C11.9462 15.9307 11.1863 16.9762 10.0303 16.9762C8.87425 16.9762 8.57675 16.3047 7.24225 16.3047C5.94175 16.3047 5.47935 16.9983 4.42195 16.9983C3.36455 16.9983 2.62675 16.0293 1.77845 14.8393C0.795853 13.4419 0.00195312 11.271 0.00195312 9.2106C0.00195312 5.9058 2.15075 4.1531 4.26555 4.1531C5.38925 4.1531 6.32595 4.8909 7.03145 4.8909C7.70295 4.8909 8.75015 4.1089 10.0286 4.1089C10.5131 4.1089 12.2539 4.1531 13.3997 5.7953ZM9.42165 2.7098C9.95035 2.0825 10.3244 1.2121 10.3244 0.3417C10.3244 0.221 10.3142 0.0986 10.2921 0C9.43185 0.0323 8.40845 0.5729 7.79135 1.2886C7.30685 1.8394 6.85465 2.7098 6.85465 3.5921C6.85465 3.7247 6.87675 3.8573 6.88695 3.8998C6.94135 3.91 7.02975 3.9219 7.11815 3.9219C7.88995 3.9219 8.86065 3.4051 9.42165 2.7098Z" fill="currentColor"></path>
