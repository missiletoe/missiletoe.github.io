name: Deploy KBPM Downloads to GitHub Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish_kbpm_pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # Fine-grained PAT with read access to missiletoe/kream_inventory.
  # Create this secret in KBPM > Settings > Secrets and variables > Actions.
  GH_TOKEN: ${{ secrets.KBPM_SOURCE_TOKEN }}
  SOURCE_REPO: missiletoe/kream_inventory
  SITE_DIR: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KBPM Pages repo
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          set -euo pipefail
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR/downloads"
          if [ -f "FEEDME.jpeg" ]; then
            cp "FEEDME.jpeg" "$SITE_DIR/FEEDME.jpeg"
          elif [ -f "docs/images/FEEDME.jpeg" ]; then
            cp "docs/images/FEEDME.jpeg" "$SITE_DIR/FEEDME.jpeg"
          fi

      - name: Download latest release assets from kream_inventory
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_TOKEN is not configured" >&2
            exit 1
          fi
          gh release download --repo "$SOURCE_REPO" --latest \
            --pattern 'KBPM-macOS-arm64.dmg' \
            --pattern 'KBPM-macOS-intel.dmg' \
            --pattern 'KBPM.exe' \
            --dir "$SITE_DIR/downloads" --clobber

      - name: Generate index.html
        working-directory: ${{ env.SITE_DIR }}
        shell: bash
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>KBPM 다운로드</title>
          <style>
            body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:2rem;line-height:1.5}
            h1{font-size:1.8rem;margin-bottom:1rem}
            .card{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:.75rem 0}
            code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
            .center{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:2rem 0;text-align:center}
            .cta{font-weight:700;font-size:1.25rem;margin-top:.75rem}
            img{max-width:100%;height:auto}
          </style>
          <h1>KBPM 다운로드</h1>

          <div class="center">
            <img src="FEEDME.jpeg" alt="Donate QR or link image">
            <div class="cta">개발자에게 커피 한 잔 사주기 ☕</div>
          </div>

          <p>아래 파일은 <code>${SOURCE_REPO}</code> 최신 릴리스에서 자동으로 동기화됩니다.</p>
          <div id="list"></div>
          <script>
          fetch('downloads/manifest.json').then(r=>r.json()).then(m=>{
            const $=s=>document.querySelector(s);
            const wrap=$('#list');
            m.files.forEach(f=>{
              const d=document.createElement('div');
              d.className='card';
              d.innerHTML=
                '<strong><a href="'+f.path+'" download>'+f.name+'</a></strong> ('+f.size+')'+
                '<div>SHA256: <code>'+f.sha256+'</code></div>';
              wrap.appendChild(d);
            });
          });
          </script>
          </html>
          HTML
          perl -pi -e 's/\$\{SOURCE_REPO\}/'"$SOURCE_REPO"'/g' index.html

      - name: Create manifest.json with checksums
        run: |
          set -euo pipefail
          cd "$SITE_DIR/downloads"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256sum(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def human_size(num: int) -> str:
              units = ["B", "KiB", "MiB", "GiB", "TiB"]
              value = float(num)
              for unit in units:
                  if value < 1024 or unit == units[-1]:
                      if unit == "B":
                          return f"{int(value)}B"
                      return f"{value:.1f}{unit}"
                  value /= 1024
              return f"{value:.1f}TiB"

          files = [
              "KBPM-macOS-arm64.dmg",
              "KBPM-macOS-intel.dmg",
              "KBPM.exe",
          ]
          manifest = {"files": []}
          for name in files:
              path = Path(name)
              if not path.exists():
                  continue
              size_bytes = path.stat().st_size
              manifest["files"].append(
                  {
                      "name": name,
                      "path": f"downloads/{name}",
                      "sha256": sha256sum(path),
                      "size": human_size(size_bytes),
                  }
              )

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)

          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
