name: Deploy KBPM Downloads to GitHub Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish_kbpm_pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # Fine-grained PAT with read access to missiletoe/kream_inventory.
  # Create this secret in KBPM > Settings > Secrets and variables > Actions.
  GH_TOKEN: ${{ secrets.KBPM_SOURCE_TOKEN }}
  SOURCE_REPO: missiletoe/kream_inventory
  SITE_DIR: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KBPM Pages repo
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          set -euo pipefail
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR/downloads"
          if [ -f "FEEDME.jpeg" ]; then
            cp "FEEDME.jpeg" "$SITE_DIR/FEEDME.jpeg"
          elif [ -f "docs/images/FEEDME.jpeg" ]; then
            cp "docs/images/FEEDME.jpeg" "$SITE_DIR/FEEDME.jpeg"
          fi

      - name: Download latest release assets from kream_inventory
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_TOKEN is not configured" >&2
            exit 1
          fi
          gh release download --repo "$SOURCE_REPO" \
            --pattern 'KBPM-macOS-arm64.dmg' \
            --pattern 'KBPM-macOS-intel.dmg' \
            --pattern 'KBPM.exe' \
            --dir "$SITE_DIR/downloads" --clobber

      - name: Generate index.html
        working-directory: ${{ env.SITE_DIR }}
        shell: bash
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>KBPM 다운로드</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap">
          <style>
            :root{
              color-scheme:light dark;
              --page-bg:#f4f6fb;
              --surface-bg:#ffffff;
              --card-bg:#f8f9fc;
              --text-color:#101828;
              --subtle-text:rgba(16,24,40,.65);
              --border-color:rgba(16,24,40,.12);
              --accent:#0f62fe;
            }
            @media (prefers-color-scheme: dark){
              :root{
                --page-bg:#0f1117;
                --surface-bg:#161925;
                --card-bg:#1f2433;
                --text-color:#f4f4f5;
                --subtle-text:rgba(244,244,245,.75);
                --border-color:rgba(244,244,245,.18);
                --accent:#6ea8fe;
              }
            }
            *{box-sizing:border-box;}
            html,body{height:100%;}
            body{
              font-family:'Nanum Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
              background:var(--page-bg);
              color:var(--text-color);
              margin:0;
              min-height:100vh;
              display:flex;
              align-items:center;
              justify-content:center;
              overflow:hidden; /* no scrollbar */
              padding:1.5rem;
            }
            .surface{
              width:min(960px,100%);
              height:min(640px,calc(100vh - 3rem));
              background:var(--surface-bg);
              border-radius:28px;
              padding:clamp(1.25rem,3vw,2.5rem);
              display:flex;
              flex-direction:column;
              gap:1.5rem;
              box-shadow:0 25px 60px rgba(15,17,26,0.18);
            }
            header{
              display:flex;
              align-items:center;
              gap:1.25rem;
            }
            header img{
              width:80px;
              height:80px;
              border-radius:20px;
              background:var(--card-bg);
              padding:0.75rem;
              object-fit:contain;
            }
            h1{
              font-size:1.9rem;
              margin:0;
            }
            .repo-meta{
              margin:0.25rem 0 0;
              font-size:0.95rem;
              color:var(--subtle-text);
            }
            main{
              flex:1;
              display:flex;
              flex-direction:column;
              gap:1.25rem;
            }
            .downloads{
              flex:1;
              display:grid;
              grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
              gap:1rem;
            }
            .card{
              background:var(--card-bg);
              border:1px solid var(--border-color);
              border-radius:22px;
              padding:1.25rem;
              display:flex;
              flex-direction:column;
              gap:0.75rem;
            }
            .card-title{
              font-size:1.1rem;
              font-weight:700;
            }
            .card-meta{
              font-size:0.9rem;
              color:var(--subtle-text);
              line-height:1.4;
            }
            .download-action{
              margin-top:auto;
            }
            .download-button{
              width:100%;
              display:inline-flex;
              align-items:center;
              justify-content:center;
              border:none;
              border-radius:999px;
              padding:0.75rem 1rem;
              font-size:1rem;
              font-weight:700;
              color:#fff;
              background:var(--accent);
              cursor:pointer;
              text-decoration:none;
              transition:transform .2s ease,box-shadow .2s ease;
            }
            .download-button:hover{
              transform:translateY(-1px);
              box-shadow:0 8px 18px rgba(15,98,254,.35);
            }
            .download-button:focus-visible{
              outline:3px solid rgba(15,98,254,.45);
              outline-offset:2px;
            }
            iframe[name="downloader"]{display:none;}

            /* Modal 기본 상태 */
            .modal{
              position:fixed;
              inset:0;
              display:flex;
              align-items:center;
              justify-content:center;
              background:rgba(15,17,26,.63);
              opacity:0;
              pointer-events:none;
              transition:opacity .18s ease;
              padding:1rem;
            }
            .modal-panel{
              background:var(--surface-bg);
              border-radius:24px;
              padding:2rem;
              max-width:420px;
              width:100%;
              text-align:center;
              box-shadow:0 20px 45px rgba(0,0,0,.35);
            }
            .modal-panel img{
              width:200px;
              max-width:70%;
              margin:0 auto 1.5rem;
              display:block;
              border-radius:16px;
            }
            .modal-panel p{margin:0.5rem 0;}
            .modal-close{
              margin-top:1.5rem;
              display:inline-flex;
              justify-content:center;
              align-items:center;
              padding:0.65rem 1.5rem;
              border-radius:999px;
              border:1px solid var(--border-color);
              cursor:pointer;
              font-weight:700;
              color:var(--text-color);
              background:transparent;
            }
            .manual-link{
              color:var(--accent);
              font-weight:700;
              text-decoration:none;
              border-bottom:1px solid currentColor;
              padding-bottom:0.15rem;
            }

            /* 다운로드 버튼이 포커스되면 모달을 표시 (CSS-only) */
            body:has(.download-button:focus) .modal,
            body:has(.download-button:active) .modal{
              opacity:1;
              pointer-events:auto;
            }

            @media (max-width:720px){
              body{padding:0.75rem;}
              .surface{height:calc(100vh - 1.5rem);border-radius:18px;}
              header{flex-direction:column;text-align:center;}
              .downloads{grid-template-columns:1fr;}
            }
          </style>
          </head>
          <body>
          <iframe name="downloader" title="다운로드 진행창"></iframe>
          <div class="surface">
            <header>
              <img src="docs/images/icon.png" alt="KBPM 아이콘">
              <div>
                <h1>KBPM 다운로드</h1>
                <p class="repo-meta">최신 릴리스 원본: <code>${SOURCE_REPO}</code></p>
              </div>
            </header>
            <main>
              <div class="downloads">
                <div class="card">
                  <div>
                    <div class="card-title">macOS · Apple Silicon</div>
                    <p class="card-meta">macOS 12 이상 · arm64 · .dmg 설치 프로그램</p>
                  </div>
                  <div class="download-action">
                    <a href="downloads/KBPM-macOS-arm64.dmg" target="downloader" class="download-button">다운로드</a>
                  </div>
                </div>
                <div class="card">
                  <div>
                    <div class="card-title">macOS · Intel</div>
                    <p class="card-meta">macOS 11 이상 · x64 · .dmg 설치 프로그램</p>
                  </div>
                  <div class="download-action">
                    <a href="downloads/KBPM-macOS-intel.dmg" target="downloader" class="download-button">다운로드</a>
                  </div>
                </div>
                <div class="card">
                  <div>
                    <div class="card-title">Windows · x64</div>
                    <p class="card-meta">Windows 10/11 · x64 · .exe 설치 프로그램</p>
                  </div>
                  <div class="download-action">
                    <a href="downloads/KBPM.exe" target="downloader" class="download-button">다운로드</a>
                  </div>
                </div>
              </div>
            </main>
          </div>
          <div class="modal">
            <div class="modal-panel">
              <img src="FEEDME.jpeg" alt="지원 안내 이미지">
              <p>다운로드가 진행중입니다...</p>
              <p>다운로드가 되지 않나요? <a href="#" class="manual-link">여기를 눌러주세요</a></p>
              <button type="button" class="modal-close">닫기</button>
            </div>
          </div>
          </body>
          </html>
          HTML
          perl -pi -e 's|\$\{SOURCE_REPO\}|'"$SOURCE_REPO"'|g' index.html

      - name: Create manifest.json with checksums
        run: |
          set -euo pipefail
          cd "$SITE_DIR/downloads"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def sha256sum(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def human_size(num: int) -> str:
              units = ["B", "KiB", "MiB", "GiB", "TiB"]
              value = float(num)
              for unit in units:
                  if value < 1024 or unit == units[-1]:
                      if unit == "B":
                          return f"{int(value)}B"
                      return f"{value:.1f}{unit}"
                  value /= 1024
              return f"{value:.1f}TiB"

          files = [
              "KBPM-macOS-arm64.dmg",
              "KBPM-macOS-intel.dmg",
              "KBPM.exe",
          ]
          manifest = {"files": []}
          for name in files:
              path = Path(name)
              if not path.exists():
                  continue
              size_bytes = path.stat().st_size
              manifest["files"].append(
                  {
                      "name": name,
                      "path": f"downloads/{name}",
                      "sha256": sha256sum(path),
                      "size": human_size(size_bytes),
                  }
              )

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)

          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
